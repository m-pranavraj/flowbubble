name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the declared version
        run: |
          set -eu
          declared="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ "v$declared" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $declared." >&2
            echo "Bump versionName and versionCode in app/build.gradle.kts first." >&2
            exit 1
          fi

      - name: Restore the release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWBUBBLE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLOWBUBBLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWBUBBLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWBUBBLE_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No signing secret is configured, so this run builds only. See docs/RELEASE.md.'
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/flowbubble-release.jks
          umask 077
          {
            echo 'storeFile=../keystore/flowbubble-release.jks'
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Assemble the release build
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Locate and verify the APK
        id: apk
        run: |
          set -eu
          path="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          signer="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -1)"
          if [ -n "$signer" ] && "$signer" verify --print-certs "$path"; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if the build is not the signed deliverable
        if: steps.signing.outputs.signed == 'true' && steps.apk.outputs.verified != 'true'
        run: |
          echo "Signing material was supplied, but apksigner did not verify the APK it built." >&2
          exit 1

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish the GitHub Release
        if: steps.apk.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" docs/assets/flowbubble-icon.png --clobber
          else
            gh release create "$tag" \
              "${{ steps.apk.outputs.path }}" \
              docs/assets/flowbubble-icon.png \
              --title "FlowBubble $tag" \
              --notes "Hold-to-talk and hands-free voice layer for Android: open, search and control any app, read the screen, and act on it with verified execution traces. Install \`FlowBubble-$tag-release.apk\` below, then complete the Setup screen for microphone, overlay, and accessibility access."
          fi
